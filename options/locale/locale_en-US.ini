rev_h = Built for reading, not just approving.
rev1_h = Intent first
rev1_p = Every change opens with its purpose, a risk summary and what changed since your last look. Files group by meaning, not alphabet: behavior, tests, generated.
rev2_h = Comments that act
rev2_p = Turn a comment into an instruction. Ask the author agent to change it, get a new version, and compare it to the last in one click.
rev3_h = An inbox that knows whose turn it is
rev3_p = Not a notification pile. Four lists: needs you, waiting on others, agents blocked on a decision, and done. Snooze, pin, and clear with one key.
rev4_h = Checks you can trust
rev4_p = CI results attach to the exact version you are reading, and stale results are marked as stale instead of passing silently.
