[startpage]
title = ASC Hub
app_desc = Source control for people and their agents
meta_description = ASC Hub hosts asc repositories. Review changesets and stacks, track what needs your attention in your inbox, and ship with confidence.
meta_keywords = asc,changesets,stacks,code review,inbox,source hosting
changesets = Changesets
changesets_desc = Work in changesets that keep their identity as they evolve, so history stays readable and every change can be reviewed on its own.
stacks = Stacks
stacks_desc = Build a feature as a stack of small, dependent changesets and land them in order without rebase gymnastics.
review = Review
review_desc = Review each changeset in context, compare versions of a change after an update, and restore an earlier version when needed.
inbox = Inbox
inbox_desc = One place for the changes that wait on you: reviews to give, feedback to answer and stacks ready to land.
pill = Built for teams where agents write a lot of the code
headline = Review code at the speed your agents write it.
lead = ASC Hub hosts your repositories as stacks of small, reviewable changes. See who or what made each one, why, and whose turn it is. Stay in control of every agent run.
connect_label = Connect the asc command line to this hub
works_with = Works with the tools your team already uses
why_eyebrow = Why ASC exists
why_title = A pull request of 2,000 lines cannot be reviewed.
why_text = Agents now write a large share of the code, and they write it fast. One giant pull request is the wrong shape for that: nobody can read it, so it gets approved on trust. ASC is the successor to the commit-and-branch workflow. It breaks the work into a stack of small changes, each with its purpose, its checks and its author, whether that is a person or an agent, with no staging area and no rebase.
benefits_label = What you get
benefit1_title = Small changes. Big features.
benefit1_text = Break work into a stack. Each change is reviewed on its own, merges in order, and restacks itself when something under it moves. Approvals survive a restack when the diff did not change. Reviewers see 80 lines at a time, not 2,000.
benefit2_title = Review that follows the change
benefit2_text = Every change opens with its purpose, a risk summary and what changed since your last look. Turn a comment into an instruction: ask the author agent to change it, get a new version, and compare it to the last in one click.
benefit3_title = An inbox that knows whose turn it is
benefit3_text = Four lists: needs you, waiting on others, agents blocked on a decision, and done. CI results attach to the exact version you are reading, and stale results are marked stale instead of passing silently.
how_eyebrow = How it works
how_title = Three steps from sign in to review
step1_title = Connect
step1_text = Install asc, then sign in once from your terminal. asc keeps the token for you.
step2_title = Clone
step2_text = Clone a repository of this hub with asc.
step3_title = Submit for review
step3_text = Submit your work and ASC Hub opens it as a stack of small changes for review. No staging area, no rebase.
agents_eyebrow = Agents as teammates you can supervise
agents_title = Give an agent a task. Keep the steering wheel.
agents_text = Every run has a scope, a budget and checkpoints. Watch the plan unfold, pause it, redirect it, or reject a step. Credentials are scoped per run and expire when it ends.
agents_scope_title = Scoped access
agents_scope_text = Paths, branches and write rights per run.
agents_budget_title = Budgets
agents_budget_text = Tokens, minutes and changes, as hard limits.
agents_checkpoint_title = Checkpoints
agents_checkpoint_text = Roll back to any step, nothing is lost.
agents_audit_title = Full audit
agents_audit_text = Every tool call, every file, every decision.
git_label = Search and compatibility
search_eyebrow = Code intelligence
search_title = Find by meaning, by name, or by text.
search_text = Symbols, references and semantic search across every branch and change, for you and for your agents over MCP.
git_eyebrow = Compatibility
git_title = Existing tools keep working.
git_text = ASC is the way to work here. For existing tools and CI that still speak git, the hub also serves a git-compatible view over HTTPS. Nobody needs git to use ASC.
explore_title = Public repositories
explore_all = Explore all repositories
explore_updated = Updated %s
cta_title = Ship more, and still understand every line.
cta_text = Import a repository in a minute. Keep your history. Bring your agents.
cta_docs = Read the docs

