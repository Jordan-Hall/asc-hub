name: asc-image
# The ASC Forgejo fork as a container image in the Forgejo registry (Dockerfile.rootless):
#   push to asc/v16  ->  hub.example.org/asc/forgejo:<sha12> and :asc-v16
# Needs the repository secret REGISTRY_TOKEN (a token with write:package) and the
# repository variable REGISTRY_USER (the user the token belongs to).
# Trust rules: only a push (or manual run) on asc/v16 or a v* tag reaches the trusted runner and
# the credential. There is no pull_request trigger, so untrusted code never sees the secret.
on:
  push:
    branches: [asc/v16]
  workflow_dispatch:

concurrency:
  group: asc-image-${{ github.ref }}
  # A running image build always finishes; newer pushes queue behind it.
  cancel-in-progress: false

env:
  REGISTRY: hub.example.org
  IMAGE: hub.example.org/asc/forgejo

jobs:
  image:
    runs-on: ${{ (github.ref == 'refs/heads/asc/v16' || startsWith(github.ref, 'refs/tags/v')) && 'asc-build-trusted' || 'asc-build' }}
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Sign in to the container registry
        if: ${{ github.ref == 'refs/heads/asc/v16' || startsWith(github.ref, 'refs/tags/v') }}
        uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # The Dockerfile builds the frontend (node) and the binary (go) inside the build.
      - name: Build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          set -euo pipefail
          docker build --file Dockerfile.rootless --tag asc-forgejo:build .

      - name: Tag and push
        if: ${{ github.ref == 'refs/heads/asc/v16' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          # The moving tag is published only from the branch; a v* tag publishes under its own name.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then name="${GITHUB_REF_NAME#v}"; else name=asc-v16; fi
          for tag in "$sha" "$name"; do
            docker tag asc-forgejo:build "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
            echo "published ${IMAGE}:${tag}"
          done
