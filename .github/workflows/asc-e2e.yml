name: asc-e2e
# The end-to-end test of the hub with the real asc: the hub's routes listen on a loopback port, the real
# `asc serve` runs against them and the real `asc` and `git` programs make every step through the hub URL
# (tests/integration/asc_e2e_test.go). It runs on a push to asc/v16, every night, and on demand.
#
# asc (one binary, `asc`, is both the client and the server) is built from the public repository
# Jordan-Hall/asc at the input asc_ref (default master). No secret is needed.
on:
  push:
    branches: [asc/v16]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      asc_ref:
        description: "Ref of Jordan-Hall/asc to build"
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: asc-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Build asc from source.
      - name: Check out asc
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Jordan-Hall/asc
          ref: ${{ inputs.asc_ref || 'master' }}
          path: asc-src
      - name: Toolchain of asc (from its rust-toolchain.toml)
        working-directory: asc-src
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: asc-src
      - name: Build asc
        working-directory: asc-src
        run: |
          cargo build --locked -p asc
          echo "ASC_BIN=$GITHUB_WORKSPACE/asc-src/target/debug/asc" >> "$GITHUB_ENV"

      - name: Run the end-to-end test
        env:
          TEST_TAGS: sqlite sqlite_unlock_notify asc
        run: |
          set -euo pipefail
          export ASC_E2E_BIN="$ASC_BIN" ASC_SERVE_BIN="$ASC_BIN"
          make 'test-sqlite#TestAscEndToEnd'
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asc-e2e-logs
          path: |
            tests/integration/*.log
            tests/integration/**/*.log
          if-no-files-found: ignore
