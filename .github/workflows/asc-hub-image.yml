name: asc-hub-image
# ASC Hub, one image with the hub and asc serve (Dockerfile.allinone), on GitHub Container Registry
# (private package):
#   push to asc/v16 -> ghcr.io/<owner>/asc-hub:<sha12> and :asc-v16, then deployed (job deploy)
#   a new asc-serve image on asc master starts this workflow with asc_image set (asc image.yml, job hub)
#
# The asc binary is copied from the published asc-serve image. Which one is decided by, in order:
#   1. the workflow_dispatch input asc_image,
#   2. the repository variable ASC_SERVE_IMAGE (a full reference with a tag, for example
#      ghcr.io/jordan-hall/asc-serve:<sha12>),
#   3. the newest tagged version of the asc-serve package of this owner.
# Pin the repository variable to the asc-serve tag you tested; option 3 is a convenience.
#
# One-time setup: the build job signs in with the workflow token, which can read the asc-serve
# package only after the package grants this repository access: open the asc-serve package on GitHub,
# Package settings > Manage Actions access > Add Repository > this repository, role Read.
on:
  push:
    branches: [asc/v16]
  workflow_dispatch:
    inputs:
      asc_image:
        description: "asc-serve image to copy asc from (full reference with tag). Empty: the ASC_SERVE_IMAGE variable, then the newest tag."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: asc-hub-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Sign in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose the asc-serve image
        id: asc
        env:
          INPUT_IMAGE: ${{ inputs.asc_image }}
          VAR_IMAGE: ${{ vars.ASC_SERVE_IMAGE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="${INPUT_IMAGE:-${VAR_IMAGE:-}}"
          if [ -z "$ref" ]; then
            # Newest version of the package that has a tag. The workflow token may be refused here.
            tag="$(gh api "/users/${owner}/packages/container/asc-serve/versions" --jq '[.[] | select(.metadata.container.tags | length > 0)][0].metadata.container.tags[0]' 2>/dev/null || true)"
            if [ -z "$tag" ] || [ "$tag" = null ]; then
              echo "::error::No asc-serve image is chosen. Set the repository variable ASC_SERVE_IMAGE (for example ghcr.io/${owner}/asc-serve:<sha12>) or run the workflow with the asc_image input."
              exit 1
            fi
            ref="ghcr.io/${owner}/asc-serve:${tag}"
          fi
          case "$ref" in
            *:*) ;;
            *) echo "::error::The asc-serve image '$ref' has no tag. Use a full reference such as ghcr.io/${owner}/asc-serve:<sha12>."; exit 1 ;;
          esac
          echo "asc-serve image: $ref"
          if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::error::Cannot read $ref. If the image exists, the asc-serve package must grant this repository access: open the package on GitHub, Package settings > Manage Actions access > Add Repository > this repository (role Read). Then run the workflow again."
            exit 1
          fi
          echo "image=$ref" >> "$GITHUB_OUTPUT"
      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/asc-hub"
          printf 'list=%s:%s,%s:asc-v16\n' "$image" "${GITHUB_SHA::12}" "$image" >> "$GITHUB_OUTPUT"
      # The Dockerfile builds the frontend (node) and the binary (go) inside the build and copies
      # asc from the asc-serve image.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.allinone
          build-args: |
            ASC_IMAGE=${{ steps.asc.outputs.image }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# ASC Hub image build

  # until the hub answers 200. Skipped while any of these is unset:
  #   variable DEPLOY_HEALTH_URL  https URL that answers 200 once the hub is up
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    concurrency:
      group: asc-hub-deploy
      cancel-in-progress: false
    env:
      HEALTH: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
        run: |
          set -euo pipefail
            exit 0
          fi
          case "$HEALTH" in https://*) ;; *) echo "::error::DEPLOY_HEALTH_URL must be https"; exit 1 ;; esac
          tag="${GITHUB_SHA::12}"
          curl --fail --silent --show-error --proto '=https' -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\":\"ASC_HUB_IMAGE_TAG\",\"value\":\"$tag\"}" "$api/envs" -o /dev/null
          curl --fail --silent --show-error --proto '=https' -X POST -H "Authorization: Bearer $TOKEN" "$api/restart" -o /dev/null
          for _ in $(seq 1 60); do
            code=$(curl --silent --proto '=https' -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH" || true)
            if [ "$code" = 200 ]; then echo "::notice::deployed asc-hub $tag"; exit 0; fi
            sleep 15
          done
          echo "::error::the hub did not answer 200 within 15 minutes of the restart"
          exit 1
