name: asc-hub-image
# ASC Hub (the ASC fork of Forgejo) on GitHub Container Registry (private package):
#   push to asc/v16 -> ghcr.io/<owner>/asc-hub:<sha12> and :asc-v16
on:
  push:
    branches: [asc/v16]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: asc-hub-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Sign in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/asc-hub"
          printf 'list=%s:%s,%s:asc-v16\n' "$image" "${GITHUB_SHA::12}" "$image" >> "$GITHUB_OUTPUT"
      # The Dockerfile builds the frontend (node) and the binary (go) inside the build.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.rootless
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# ASC Hub image build
