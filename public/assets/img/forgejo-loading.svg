<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256" role="img" aria-label="ASC Hub">
  <style>
    .fig{fill:#125469;opacity:.15;transform-box:fill-box;transform-origin:50% 100%;animation:asc-rise 1500ms ease-in-out infinite}
    @keyframes asc-rise{0%,100%{opacity:.15;transform:scaleY(.85)}35%{opacity:1;transform:scaleY(1)}70%{opacity:.15;transform:scaleY(.85)}}
    @media (prefers-color-scheme:dark){.fig{fill:#22d3ee}}
    @media (prefers-reduced-motion:reduce){.fig{animation:none;opacity:1}}
  </style>
  <g>
    <g class="fig" style="animation-delay:0ms"><circle cx="24" cy="82" r="13"/><rect x="12" y="104" width="24" height="68" rx="12"/></g>
    <g class="fig" style="animation-delay:150ms"><circle cx="62" cy="58" r="13"/><rect x="50" y="80" width="24" height="92" rx="12"/></g>
    <g class="fig" style="animation-delay:300ms"><circle cx="100" cy="34" r="13"/><rect x="88" y="56" width="24" height="116" rx="12"/></g>
    <g class="fig" style="animation-delay:450ms"><circle cx="138" cy="58" r="13"/><rect x="126" y="80" width="24" height="92" rx="12"/></g>
    <g class="fig" style="animation-delay:600ms"><circle cx="176" cy="82" r="13"/><rect x="164" y="104" width="24" height="68" rx="12"/></g>
  </g>
</svg>
